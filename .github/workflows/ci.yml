name: CI — eBrowser

on:
  push:
    branches: [master, main, develop]
    tags: ["v*"]
  pull_request:
    branches: [master, main, develop]

permissions:
  contents: read

jobs:
  test:
    name: Native C tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DeBrowser_USE_MBEDTLS=ON
          -DeBrowser_BUILD_STANDALONE=OFF

      - name: Build
        run: cmake --build build --config Debug --parallel 2

      - name: Run tests
        run: ctest --test-dir build -C Debug --output-on-failure --no-tests=error

  build:
    name: Native build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DeBrowser_BUILD_STANDALONE=OFF
      - name: Build
        run: cmake --build build --config Release --parallel 2
